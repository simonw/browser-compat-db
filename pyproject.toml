readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "sqlite-utils>=3.39",
]

[dependency-groups]
dev = [
    "cogapp>=3.6.0",
    "pytest>=9.1.1",
]
